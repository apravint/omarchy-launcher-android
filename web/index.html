<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Omarchy Android Launcher</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="shape-squircle theme-tokyonight">

  <!-- Top At-a-Glance Clock & Weather Header -->
  <div class="clock-widget">
    <div class="time-display" id="time-val">12:00</div>
    <div class="date-display" id="date-val">Loading...</div>
    <div class="at-a-glance-bar">
      <span class="weather-pill" id="weather-val">☀️ 26°C • Clear</span>
      <span class="battery-pill" id="battery-val">🔋 85%</span>
    </div>
    <div class="badge-row">
      <div class="device-badge-pill" id="device-badge">⚡ Omarchy OS • Android</div>
      <button class="set-default-btn" onclick="setDefaultHomeLauncher()">Set Default Launcher</button>
    </div>
  </div>

  <!-- AI Command & App Search Bar -->
  <div class="ai-bar-card">
    <div class="ai-icon">⚡</div>
    <input type="text" class="ai-input" id="ai-prompt-input" placeholder="Search apps, web, or AI prompt..." autocomplete="off">
    <button class="clear-btn" id="search-clear" style="display:none;" onclick="clearSearch()">✕</button>
  </div>

  <!-- Quick Action Search Shortcuts Container (Dynamic Web / Play Store search) -->
  <div class="search-actions-row" id="search-shortcuts" style="display:none;">
    <button class="search-action-chip" id="btn-web-search">🔍 Search Web</button>
    <button class="search-action-chip" id="btn-store-search">🛍️ Play Store</button>
  </div>

  <!-- Main Launcher Layout Container with Alphabet Fast Scroller -->
  <div class="launcher-layout-wrapper">

    <!-- Scrollable App Grid Container -->
    <div class="main-content-area" id="main-scroll-area">
      
      <!-- Category & Grid Density Bar -->
      <div class="controls-row">
        <div class="category-pills">
          <div class="pill active" data-category="All">All Apps <span class="badge" id="count-all">0</span></div>
          <div class="pill" data-category="System">System <span class="badge" id="count-system">0</span></div>
          <div class="pill" data-category="Dev & AI">Dev & AI <span class="badge" id="count-dev">0</span></div>
          <div class="pill" data-category="User">Installed <span class="badge" id="count-user">0</span></div>
        </div>

        <!-- Grid Density Selector -->
        <div class="grid-density-picker">
          <button class="density-btn" data-cols="4" onclick="setGridDensity(4)">4x4</button>
          <button class="density-btn active" data-cols="5" onclick="setGridDensity(5)">5x5</button>
          <button class="density-btn" data-cols="6" onclick="setGridDensity(6)">6x6</button>
        </div>
      </div>

      <!-- App Grid -->
      <div class="app-grid grid-cols-5" id="app-grid-container">
        <div class="loading-spinner">Scanning installed apps...</div>
      </div>

    </div>

    <!-- Niagara-Style Vertical Alphabet Fast-Scroller Index -->
    <div class="fast-scroll-indexer" id="alphabet-indexer">
      <!-- Populated by app.js: A-Z index -->
    </div>

  </div>

  <!-- Favorite Apps Hotseat Pinned Shelf -->
  <div class="hotseat-dock" id="hotseat-container">
    <!-- Rendered dynamically by app.js -->
  </div>

  <!-- Bottom Glass Navigation Dock -->
  <div class="bottom-bar">
    <button class="bar-btn active" title="Home" onclick="scrollToTop()">🏠</button>
    <button class="bar-btn" title="Themes & Customizer" onclick="openThemeModal()">🎨</button>
    <button class="bar-btn" title="Wallpaper" onclick="openWallpaper()">🖼️</button>
    <button class="bar-btn" title="Settings" onclick="openSystemSettings()">⚙️</button>
  </div>

  <!-- Customization & Theme Selector Modal -->
  <div class="modal-overlay" id="theme-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>🎨 Themes & Customization</h3>
        <button class="close-btn" onclick="closeThemeModal()">✕</button>
      </div>
      
      <!-- Icon Shape Selector -->
      <div class="section-label">Icon Mask Shapes</div>
      <div class="shape-selector-row">
        <button class="shape-btn active" data-shape="squircle" onclick="setIconShape('squircle')">Squircle</button>
        <button class="shape-btn" data-shape="circle" onclick="setIconShape('circle')">Circle</button>
        <button class="shape-btn" data-shape="rounded" onclick="setIconShape('rounded')">Square</button>
        <button class="shape-btn" data-shape="teardrop" onclick="setIconShape('teardrop')">Teardrop</button>
      </div>

      <div class="section-label">Cyberpunk & Minimal Palettes</div>
      <div class="theme-grid" id="theme-grid-container">
        <!-- Rendered by app.js -->
      </div>
    </div>
  </div>

  <!-- App Info Context Modal -->
  <div class="modal-overlay" id="app-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="app-modal-title">App Details</h3>
        <button class="close-btn" onclick="closeAppModal()">✕</button>
      </div>
      <div class="app-modal-content">
        <div id="app-modal-icon" class="app-modal-icon-container"></div>
        <p id="app-modal-pkg" class="app-modal-pkg-name"></p>
        <div class="modal-actions">
          <button class="modal-action-btn primary" id="btn-launch-modal">🚀 Launch App</button>
          <button class="modal-action-btn secondary" id="btn-pin-hotseat">📌 Pin / Unpin Dock</button>
          <button class="modal-action-btn secondary" id="btn-info-modal">ℹ️ Settings</button>
          <button class="modal-action-btn danger" id="btn-uninstall-modal">🗑️ Uninstall</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
