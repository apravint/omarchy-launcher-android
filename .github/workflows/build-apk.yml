name: Build & Release Omarchy Android Launcher APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Package Mobile Launcher Bundle & Web App
        run: |
          mkdir -p android/app/src/main/assets/web
          cp -r web/* android/app/src/main/assets/web/
          zip -r OmarchyLauncher-v1.0.0-AppBundle.zip web/ android/
          echo "✔ Web assets and native Android container packaged cleanly"

      - name: Upload Launcher Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmarchyLauncher-AppBundle
          path: |
            *.zip
            android/app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore

      - name: Create GitHub Release with APK Asset
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: "Omarchy Launcher v1.0.0"
          body: |
            ## 📱 Omarchy Launcher for Android v1.0.0 Release
            
            ### ✨ Features Included:
            - ⚡ **Built-in AI Assistant Bar**: Quick AI prompts directly on home screen.
            - 🔮 **Glassmorphic App Cards & Grid**: Categorized app launcher (Dev & AI, System, Media).
            - 🎨 **Omarchy 22 Theme Palette System**: Switch live between Tokyo Night, Catppuccin, Nord, Cyberpunk.
            - 📱 **Native System Home Launcher Intent**: Set as default Android home launcher.

            Download the attached `.apk` file below to install directly on your Android device!
          files: |
            android/app/build/outputs/apk/**/*.apk
            *.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
