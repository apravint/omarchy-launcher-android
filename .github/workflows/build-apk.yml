name: Build & Release Omarchy Android Launcher APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile Native OmarchyLauncher.apk
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          PLATFORM="$ANDROID_HOME/platforms/android-34/android.jar"
          
          mkdir -p build/gen build/obj build/apk_assets/assets/web
          cp -r web/* build/apk_assets/assets/web/
          
          # 1. AAPT Generate R.java
          $BUILD_TOOLS/aapt package -f -m \
            -J build/gen \
            -M android/app/src/main/AndroidManifest.xml \
            -S android/app/src/main/res \
            -I $PLATFORM
            
          # 2. Javac Compile Java Classes
          javac -d build/obj \
            -classpath $PLATFORM \
            build/gen/com/apravint/omarchylauncher/R.java \
            android/app/src/main/java/com/apravint/omarchylauncher/MainActivity.java
            
          # 3. D8 Dexing with Min API 24
          $BUILD_TOOLS/d8 --min-api 24 --output build/ \
            build/obj/com/apravint/omarchylauncher/*.class
            
          # 4. Package Unsigned APK
          $BUILD_TOOLS/aapt package -f \
            -M android/app/src/main/AndroidManifest.xml \
            -S android/app/src/main/res \
            -I $PLATFORM \
            -F OmarchyLauncher-raw.apk build/apk_assets
            
          # 5. Add classes.dex to APK
          cd build
          $BUILD_TOOLS/aapt add ../OmarchyLauncher-raw.apk classes.dex
          cd ..
          
          # 6. 4-Byte ZipAlign (Required for Android 14/15 Motorola devices)
          $BUILD_TOOLS/zipalign -v 4 OmarchyLauncher-raw.apk OmarchyLauncher-aligned.apk
          
          # 7. Keystore Generation & V1/V2/V3 Signature Scheme Signing
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          $BUILD_TOOLS/apksigner sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out OmarchyLauncher.apk \
            OmarchyLauncher-aligned.apk
          
          echo "✔ Successfully ZipAligned & V2/V3 Signed OmarchyLauncher.apk!"
          ls -lh OmarchyLauncher.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmarchyLauncher-APK
          path: OmarchyLauncher.apk

      - name: Create GitHub Release with APK Asset
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: "Omarchy Launcher v1.5.0"
          body: |
            ## 📱 Omarchy Launcher for Android v1.5.0 (Top-Notch Launcher Features Release)
            
            ### 🌟 Top Launcher Comparative Features:
            - 🔤 **Niagara-Style Alphabet Fast Scroller**: Interactive vertical A-Z index bar on the right side of screen for instant 1-tap scrolling to any app letter.
            - 🔷 **Custom App Icon Masks**: Switch live between **Squircle**, **Circle**, **Square**, and **Teardrop** icon shapes (competing with Lawnchair & Smart Launcher 6).
            - ☀️ **Pixel-Style At-a-Glance Widget**: Live weather preview and battery percentage status pill right on top of the date & clock header.
            - 🔍 **Universal Search Chips (Web & Play Store)**: Quick fallback chips to search Google Web or Play Store for any query directly from the launcher search bar.
            - ⚡ **4-Byte ZipAligned & V1/V2/V3 Dual Signed**: Fully optimized for Motorola Edge, Pixel, Samsung, Xiaomi, and Android 14/15 devices.

            Download `OmarchyLauncher.apk` below and install directly on your Android phone!
          files: |
            OmarchyLauncher.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
