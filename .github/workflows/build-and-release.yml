name: Omarchy Multi-OS Launcher CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Test & Build Flutter App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project
        run: flutter analyze

      - name: Run Widget & Unit Tests
        run: flutter test

      - name: Build Web Bundle
        run: flutter build web --release --base-href "/omarchy-launcher-android/"

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omarchy-launcher-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v2.1.0' }}
          name: "Omarchy Multi-OS Launcher ${{ github.ref_name || 'v2.1.0' }}"
          files: build/app/outputs/flutter-apk/app-release.apk
          body: |
            ### 📱 Omarchy Multi-OS Launcher for Android
            Pure Flutter 3.x unified 3-in-1 desktop simulation launcher for Android and Web.

            - **Omarchy Hyprland / IRAM OS Mode**: Top Waybar, dual-tiled windows (Kitty Terminal with neofetch, Neovim editor), and Wofi modal fuzzy runner.
            - **macOS Sonoma Mode**: Top Menu Bar (``, active app, status tray) and floating glassmorphic Dock.
            - **Windows 11 Fluent Mode**: Centered Mica taskbar (`⊞`) and floating Start Menu.
            - **Instant Mode Switcher**: Seamless 1-tap switching between all 3 desktop operating systems.
